name: Build & Release Nexar Tienda

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ════════════════════════════════════════
  # 🔍 DETECTAR VERSIÓN
  # ════════════════════════════════════════
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Obtener y validar versión
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < VERSION)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ VERSION debe tener formato SemVer X.Y.Z (recibido: '$VERSION')."
            exit 1
          fi
          CHANGELOG_VERSION=$(grep -m1 -oP '\[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          if [ "$VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "❌ VERSION ($VERSION) no coincide con la última entrada de CHANGELOG ($CHANGELOG_VERSION)."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "❌ El tag '$GITHUB_REF_NAME' no coincide con VERSION='$VERSION' (esperado: 'v$VERSION')."
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Versión detectada: $VERSION"

  # ════════════════════════════════════════
  # 🐧 BUILD LINUX (.deb)
  # ════════════════════════════════════════
  build-linux:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - name: Verificar secret SSH del SDK de licencias
        env:
          SDK_DEPLOY_KEY: ${{ secrets.NEXAR_LICENCIAS_DEPLOY_KEY }}
        run: |
          if [ -z "$SDK_DEPLOY_KEY" ]; then
            echo "❌ ERROR: El secret NEXAR_LICENCIAS_DEPLOY_KEY no está configurado."
            echo "   Este workflow necesita leer el repositorio privado rolojnb/nexar_licencias por SSH."
            echo "   Crear una Deploy Key de solo lectura en ese repo y guardar la clave privada en:"
            echo "   Settings → Secrets and variables → Actions → New repository secret"
            echo "   Nombre: NEXAR_LICENCIAS_DEPLOY_KEY"
            exit 1
          fi

      - name: Configurar acceso SSH a nexar_licencias
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NEXAR_LICENCIAS_DEPLOY_KEY }}

      - name: Confiar en github.com para dependencias SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fakeroot \
            dpkg \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Generar configuración pública de licencias
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import json, os
          url = os.getenv("SUPABASE_URL", "").strip()
          anon = os.getenv("SUPABASE_ANON_KEY", "").strip() or os.getenv("SUPABASE_KEY", "").strip()
          if not url or not anon:
              print("❌ ERROR: SUPABASE_URL y SUPABASE_ANON_KEY/SUPABASE_KEY son obligatorios para compilar un instalador con activación online.")
              print("   Configurarlos en Settings → Secrets and variables → Actions.")
              raise SystemExit(1)
          os.makedirs("build", exist_ok=True)
          with open("build/license_runtime_config.json", "w", encoding="utf-8") as fh:
              json.dump({
                  "SUPABASE_URL": url,
                  "SUPABASE_ANON_KEY": anon,
                  "SUPABASE_KEY": anon,
                  "LICENSE_PRODUCT": "nexar-tienda"
              }, fh, indent=2)
          print("✅ Configuración pública de licencias generada para runtime.")
          PY

      - name: Escribir clave pública RSA
        env:
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
        run: |
          if [ -z "$PUBLIC_KEY" ]; then
            echo "❌ ERROR: El secret PUBLIC_KEY no está configurado en el repositorio."
            echo "   Ir a: Settings → Secrets and variables → Actions → New repository secret"
            echo "   Nombre: PUBLIC_KEY"
            echo "   Valor: contenido de keys/public_key.pem (incluir las líneas -----BEGIN/END-----)"
            exit 1
          fi
          mkdir -p keys
          echo "$PUBLIC_KEY" > keys/public_key.pem
          echo "✅ keys/public_key.pem escrito ($(wc -c < keys/public_key.pem) bytes)"

      - name: Build Linux con PyInstaller
        run: |
          pyinstaller build/nexar_tienda_linux.spec \
            --distpath dist \
            --workpath build/work \
            --noconfirm

      - name: Verificar binario generado
        run: |
          if [ ! -f "dist/NexarTienda" ]; then
            echo "❌ No se encontró dist/NexarTienda"
            ls dist/ || echo "(directorio dist vacío)"
            exit 1
          fi
          echo "✅ Binario encontrado: $(du -sh dist/NexarTienda)"

      - name: Generar paquete .deb
        run: |
          chmod +x build_deb.sh
          bash build_deb.sh

      - name: Preparar artefactos Linux
        run: |
          mkdir -p release
          cp *.deb release/ 2>/dev/null || true
          echo "📦 Contenido de release/:"
          ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*
          retention-days: 2

  # ════════════════════════════════════════
  # 🪟 BUILD WINDOWS (.exe + Inno Setup)
  # ════════════════════════════════════════
  build-windows:
    needs: check
    runs-on: windows-2022
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - name: Verificar secret SSH del SDK de licencias
        shell: pwsh
        env:
          SDK_DEPLOY_KEY: ${{ secrets.NEXAR_LICENCIAS_DEPLOY_KEY }}
        run: |
          if (-not $env:SDK_DEPLOY_KEY) {
            Write-Error "❌ ERROR: El secret NEXAR_LICENCIAS_DEPLOY_KEY no está configurado."
            Write-Host "   Este workflow necesita leer el repositorio privado rolojnb/nexar_licencias por SSH."
            Write-Host "   Crear una Deploy Key de solo lectura en ese repo y guardar la clave privada en:"
            Write-Host "   Settings → Secrets and variables → Actions → New repository secret"
            Write-Host "   Nombre: NEXAR_LICENCIAS_DEPLOY_KEY"
            exit 1
          }

      - name: Configurar acceso SSH a nexar_licencias
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NEXAR_LICENCIAS_DEPLOY_KEY }}

      - name: Confiar en github.com para dependencias SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Generar configuración pública de licencias
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          $supabaseKey = if ($env:SUPABASE_ANON_KEY) { $env:SUPABASE_ANON_KEY } else { $env:SUPABASE_KEY }
          if (-not $env:SUPABASE_URL -or -not $supabaseKey) {
            Write-Error "❌ ERROR: SUPABASE_URL y SUPABASE_ANON_KEY/SUPABASE_KEY son obligatorios para compilar un instalador con activación online."
            Write-Host "   Configurarlos en Settings → Secrets and variables → Actions."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $config = @{
            SUPABASE_URL = $env:SUPABASE_URL
            SUPABASE_ANON_KEY = $supabaseKey
            SUPABASE_KEY = $supabaseKey
            LICENSE_PRODUCT = "nexar-tienda"
          }
          $config | ConvertTo-Json | Set-Content -Path build\license_runtime_config.json -Encoding UTF8
          Write-Host "✅ Configuración pública de licencias generada para runtime."

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Escribir clave pública RSA
        shell: pwsh
        env:
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
        run: |
          if (-not $env:PUBLIC_KEY) {
            Write-Error "❌ ERROR: El secret PUBLIC_KEY no está configurado en el repositorio."
            Write-Host "   Ir a: Settings → Secrets and variables → Actions → New repository secret"
            Write-Host "   Nombre: PUBLIC_KEY"
            Write-Host "   Valor: contenido de keys/public_key.pem"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path keys | Out-Null
          $env:PUBLIC_KEY | Set-Content -Path keys\public_key.pem -Encoding UTF8
          $size = (Get-Item keys\public_key.pem).Length
          Write-Host "✅ keys/public_key.pem escrito ($size bytes)"

      - name: Build Windows con PyInstaller
        run: |
          pyinstaller build/nexar_tienda_windows.spec `
            --distpath dist `
            --workpath build/work `
            --noconfirm

      - name: Verificar binario generado
        shell: pwsh
        run: |
          Write-Host "Contenido de dist:"
          Get-ChildItem -Recurse dist -ErrorAction SilentlyContinue
          if (!(Test-Path "dist\NexarTienda.exe")) {
            Write-Error "❌ No se encontró dist\NexarTienda.exe"
            exit 1
          }
          $size = (Get-Item "dist\NexarTienda.exe").Length / 1MB
          Write-Host "✅ Binario encontrado: $([math]::Round($size, 1)) MB"

      - name: Generar instalador con Inno Setup
        shell: pwsh
        run: |
          $ver = "${{ needs.check.outputs.version }}"
          Write-Host "📦 Compilando instalador v$ver..."
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$ver" `
            "build\nexar_tienda.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Inno Setup falló con código $LASTEXITCODE"
            exit 1
          }
          Write-Host "✅ Instalador generado correctamente"

      - name: Preparar artefactos Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem "dist\installer" -File | Copy-Item -Destination release\
          Write-Host "📦 Contenido de release\:"
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*
          retention-days: 2

  # ════════════════════════════════════════
  # 📦 PACKAGE: SHA256 + FIRMA GPG
  # ════════════════════════════════════════
  package:
    needs: [check, build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Reunir y validar solo instaladores públicos
        run: |
          set -euo pipefail
          mkdir -p final
          while IFS= read -r -d '' file; do
            cp "$file" final/
          done < <(
            find artifacts -mindepth 2 -maxdepth 2 -type f \
              \( -name '*.deb' -o -name '*.exe' \) -print0
          )
          expected_assets=(
            Nexar_Comercio_Windows_Setup.exe
            Nexar_Comercio_Linux_amd64.deb
          )
          actual_assets=(final/*.exe final/*.deb)
          (( ${#actual_assets[@]} == ${#expected_assets[@]} )) || {
            echo "❌ Cantidad inesperada de instaladores públicos."
            exit 1
          }
          for asset in "${actual_assets[@]}"; do
            case "$(basename "$asset")" in
              Nexar_Comercio_Windows_Setup.exe|Nexar_Comercio_Linux_amd64.deb) ;;
              *)
                echo "❌ Instalador público inesperado: $(basename "$asset")"
                exit 1
                ;;
            esac
          done
          for expected in "${expected_assets[@]}"; do
            test -f "final/$expected" || { echo "❌ Falta $expected"; exit 1; }
          done
          if find final -maxdepth 1 -type f \
              \( -name 'base_library.zip' -o -name 'python*.zip' \) -print -quit | grep -q .; then
            echo "❌ Se encontró un archivo interno del bundle en el artifact final."
            exit 1
          fi

      - name: Generar SHA256 único
        working-directory: final
        run: |
          sha256sum \
            Nexar_Comercio_Windows_Setup.exe \
            Nexar_Comercio_Linux_amd64.deb > SHA256SUMS.txt
          echo "🔒 Checksums generados:"
          cat SHA256SUMS.txt

      - name: Configurar GPG
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent

      - name: Importar clave GPG
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "✅ Clave GPG importada"

      - name: Firmar archivos
        run: |
          find final -type f ! -name "*.sig" -exec \
          gpg --batch --yes \
              --pinentry-mode loopback \
              --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --detach-sign {} \;
          echo "✅ Archivos firmados"

      - name: Verificar hashes y firmas finales
        run: |
          set -euo pipefail
          for asset in \
            Nexar_Comercio_Windows_Setup.exe \
            Nexar_Comercio_Linux_amd64.deb \
            SHA256SUMS.txt; do
            test -f "final/$asset"
            test -f "final/$asset.sig"
          done
          grep -F "Nexar_Comercio_Windows_Setup.exe" final/SHA256SUMS.txt
          grep -F "Nexar_Comercio_Linux_amd64.deb" final/SHA256SUMS.txt
          if grep -E 'NexarComercio_|NexarTienda_|nexar-tienda_' final/SHA256SUMS.txt; then
            echo "❌ SHA256SUMS contiene nombres públicos legacy."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: final
          path: final/*
          retention-days: 2

  # ════════════════════════════════════════
  # 🚀 RELEASE EN GITHUB
  # ════════════════════════════════════════
  release:
    needs: [check, package]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: final
          path: final/

      - name: Instalar GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh

      - name: Verificar si el release ya existe
        id: release_check
        run: |
          set -euo pipefail
          TAG="v${{ needs.check.outputs.version }}"
          set +e
          RESPONSE=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/releases/tags/$TAG" 2>&1)
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Release $TAG ya existe — solo se actualizarán los assets"
          elif printf '%s' "$RESPONSE" | grep -q 'HTTP 404'; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "🆕 Se creará el release $TAG"
          else
            echo "❌ Error consultando el release $TAG con GitHub CLI."
            echo "$RESPONSE"
            exit "$STATUS"
          fi

      - name: Generar descripción desde CHANGELOG
        run: |
          VER="${{ needs.check.outputs.version }}"
          awk -v ver="$VER" '
          $0 ~ "## \\["ver"\\]" {flag=1; next}
          /^## \[/ && flag {exit}
          flag
          ' CHANGELOG.md > release.md
          echo "📝 Descripción del release:"
          cat release.md

      - name: Crear release (si no existe)
        if: steps.release_check.outputs.exists == 'false'
        run: |
          TAG="v${{ needs.check.outputs.version }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Nexar Tienda v${{ needs.check.outputs.version }}" \
            --notes-file release.md \
            --latest \
            --target $GITHUB_SHA
          echo "✅ Release creado: $TAG"

      - name: Verificar release antes de subir assets
        run: |
          set -euo pipefail
          TAG="v${{ needs.check.outputs.version }}"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/releases/tags/$TAG" >/dev/null
          echo "✅ Release confirmado: $TAG"

      - name: Subir assets al release
        run: |
          set -euo pipefail
          TAG="v${{ needs.check.outputs.version }}"

          for file in final/*; do
            name=$(basename "$file")
            echo "⬆️  Subiendo $name..."
            # Eliminar asset previo si existe (para permitir re-runs sin conflicto)
            gh release delete-asset "$TAG" "$name" -y --repo "${{ github.repository }}" 2>/dev/null || true
            gh release upload "$TAG" "$file" --repo "${{ github.repository }}"
            echo "   ✅ $name subido"
          done
